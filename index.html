<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Daily Worker Tracker</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- jsPDF & AutoTable (PDF Export) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e2e8f0;
      margin: 0;
      padding: 0;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .bottom-sheet-enter {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Mobile App Shell Container -->

    <!-- Top App Bar -->

      <div class="flex items-center justify-between">
        <div>

            <span class="inline-flex items-center justify-center w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-400">

                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />

            <h1 class="text-base font-bold tracking-tight">Daily Worker Tracker</h1>

        </div>

        <!-- Month Selector Pill -->
        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-2xl p-1">
          <button onclick="changeActiveMonth(-1)" aria-label="Bulan Sebelumnya" class="p-1.5 text-slate-300 hover:text-white active:scale-90 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <span id="header-month-label" class="text-xs font-semibold px-2 min-w-[88px] text-center text-emerald-300">Nov 2026</span>
          <button onclick="changeActiveMonth(1)" aria-label="Bulan Berikutnya" class="p-1.5 text-slate-300 hover:text-white active:scale-90 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- Reminder Banner if active -->
      <div id="reminder-banner" class="hidden mt-3 bg-amber-500/15 border border-amber-400/30 rounded-2xl px-3.5 py-2 flex items-center justify-between text-xs text-amber-200">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="reminder-banner-text">Jangan lupa catat absensi hari ini!</span>
        </div>
        <button onclick="dismissReminderBanner()" class="text-amber-300 hover:text-white font-semibold ml-2">Tutup</button>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main id="main-content" class="flex-1 px-4 pt-4 pb-28 overflow-y-auto">
      <!-- Dynamic view rendered by JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-2 flex justify-around items-center shadow-[0_-4px_20px_rgba(15,23,42,0.06)]">

    <!-- Edit/Add Attendance Bottom Sheet Modal -->

        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-bold text-slate-900">Catat / Edit Absensi</h3>
            <p id="modal-date-subtitle" class="text-xs text-slate-500 mt-0.5">Jumat, 20 November 2026</p>
          </div>

            </span>

          <button type="button" onclick="selectModalStatus('Belum Ada Info')" id="modal-status-Belum" class="modal-status-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 transition">

              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

          </button>

        <!-- Optional Note -->
        <div class="mb-5">
          <label for="modal-note-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Catatan Shift / Lokasi (Opsional)</label>
          <input type="text" id="modal-note-input" placeholder="Contoh: Shift Pagi Gudang A, Bongkar Muat..." class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
        </div>

        <button onclick="saveAttendanceFromModal()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-semibold text-sm rounded-2xl shadow-lg transition">

    <!-- Custom Confirmation Modal (Replaces window.confirm) -->

          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>

            Batal

    <!-- Toast Notification Banner (Replaces window.alert) -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
      <div id="toast-box" class="bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 border border-slate-700">
        <span id="toast-icon" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toast-text">Tersimpan</span>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // STATE MANAGEMENT & LOCAL STORAGE PERSISTENCE
    // =========================================================================
    const STORAGE_KEY = 'daily_worker_tracker_v1';

    const DAYS_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const MONTHS_ID = [
      'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];
    const MONTHS_SHORT_ID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

    const DEFAULT_STATE = {
      settings: {
        workerName: 'Budi Santoso',
        workerRole: 'Daily Worker / Helper Gudang',
        dailyWage: 150000,
        autoSundayOff: true,
        payPeriodType: 'calendar', // 'calendar' (1-akhir bulan) or 'cutoff' (26-25)
        cutoffStartDay: 26,
        reminderEnabled: true,
        reminderTime: '17:00',
      },
      // Key: 'YYYY-MM-DD' -> { status: 'Masuk' | 'Libur' | 'Belum Ada Info', note: string, updatedAt: string }
      records: {},
    };

    let appState = loadState();
    let currentTab = 'dashboard';
    let selectedModalStatus = 'Masuk';
    let historyFilterStatus = 'ALL';
    let historySearchQuery = '';
    let reminderDismissedToday = false;

    // Active viewed year & month (defaults to current device month)
    const now = new Date();
    let activeYear = now.getFullYear();
    let activeMonth = now.getMonth(); // 0-indexed

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = JSON.parse(JSON.stringify(DEFAULT_STATE));
          saveStateToStorage(initial);
          return initial;
        }
        const parsed = JSON.parse(raw);
        return {
          settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) },
          records: parsed.records || {},
        };
      } catch (e) {
        console.error('Gagal memuat data:', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveStateToStorage(stateObj = appState) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObj));
      } catch (e) {
        showToast('Gagal menyimpan ke penyimpanan lokal', 'error');
      }
    }

    // =========================================================================
    // DATE & BUSINESS LOGIC HELPERS
    // =========================================================================
    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateIndo(dateStr, includeDay = true) {
      const d = parseDateStr(dateStr);
      const dayName = DAYS_ID[d.getDay()];
      const dayNum = d.getDate();
      const monthName = MONTHS_ID[d.getMonth()];
      const year = d.getFullYear();
      return includeDay ? `${dayName}, ${dayNum} ${monthName} ${year}` : `${dayNum} ${monthName} ${year}`;
    }

    function formatRupiah(amount) {
      return 'Rp' + Number(amount || 0).toLocaleString('id-ID');
    }

    /**
     * Mendapatkan status efektif untuk tanggal tertentu:
     * 1. Jika user sudah mencatat tanggal tersebut, gunakan catatan user.
     * 2. Jika belum dicatat DAN hari Minggu serta autoSundayOff aktif -> 'Libur' (otomatis).
     * 3. Selain itu -> 'Belum Ada Info'.
     */
    function getEffectiveRecord(dateStr) {
      const saved = appState.records[dateStr];
      if (saved) {
        return {
          status: saved.status,
          note: saved.note || '',
          isAutoSunday: false,
          isSaved: true,
        };
      }
      const dateObj = parseDateStr(dateStr);
      if (appState.settings.autoSundayOff && dateObj.getDay() === 0) {
        return {
          status: 'Libur',
          note: 'Libur otomatis hari Minggu',
          isAutoSunday: true,
          isSaved: false,
        };
      }
      return {
        status: 'Belum Ada Info',
        note: '',
        isAutoSunday: false,
        isSaved: false,
      };
    }

    /**
     * Menentukan jadwal besok (Masuk / Libur) berdasarkan catatan besok atau aturan hari Minggu.
     */
    function getTomorrowSchedule() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = toDateStr(tomorrow);
      const saved = appState.records[tomorrowStr];

      if (saved && saved.status !== 'Belum Ada Info') {
        return {
          dateStr: tomorrowStr,
          status: saved.status,
          reason: 'Sesuai jadwal yang Anda atur',
        };
      }
      if (appState.settings.autoSundayOff && tomorrow.getDay() === 0) {
        return {
          dateStr: tomorrowStr,
          status: 'Libur',
          reason: 'Otomatis libur (Hari Minggu)',
        };
      }
      return {
        dateStr: tomorrowStr,
        status: 'Masuk',
        reason: 'Jadwal kerja reguler',
      };
    }

    /**
     * Mendapatkan daftar tanggal (YYYY-MM-DD) dalam periode bulan aktif
     * Mendukung Periode Kalender (1 - akhir bulan) maupun Periode Cut-Off (misal 26 - 25).
     */
    function getPeriodDates(year, month) {
      const dates = [];
      if (appState.settings.payPeriodType === 'cutoff') {
        const startDay = Number(appState.settings.cutoffStartDay) || 26;
        // Mulai dari startDay bulan sebelumnya sampai (startDay - 1) bulan aktif
        const startDate = new Date(year, month - 1, startDay);
        const endDate = new Date(year, month, startDay - 1);
        const cursor = new Date(startDate);
        while (cursor <= endDate) {
          dates.push(toDateStr(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }
      } else {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          dates.push(toDateStr(new Date(year, month, d)));
        }
      }
      return dates;
    }

    /**
     * Menghitung ringkasan absensi dan gaji untuk periode aktif.
     */
    function calculatePeriodSummary(year, month) {
      const dates = getPeriodDates(year, month);
      const todayStr = toDateStr(new Date());
      let totalMasuk = 0;
      let totalLibur = 0;
      let totalBelumInfo = 0;
      const dailyRows = [];

      dates.forEach((dateStr) => {
        const dateObj = parseDateStr(dateStr);
        const saved = appState.records[dateStr];
        let effectiveStatus = 'Belum Ada Info';
        let note = '';
        let isAutoSunday = false;

        if (saved) {
          effectiveStatus = saved.status;
          note = saved.note || '';
        } else if (
          appState.settings.autoSundayOff &&
          dateObj.getDay() === 0 &&
          dateStr <= todayStr
        ) {
          // Hari Minggu yang sudah lewat/hari ini otomatis terhitung sebagai Libur
          effectiveStatus = 'Libur';
          note = 'Libur otomatis (Minggu)';
          isAutoSunday = true;
        }

        const wage = effectiveStatus === 'Masuk' ? Number(appState.settings.dailyWage) : 0;

        if (effectiveStatus === 'Masuk') totalMasuk++;
        else if (effectiveStatus === 'Libur') totalLibur++;
        else totalBelumInfo++;

        dailyRows.push({
          dateStr,
          dayName: DAYS_ID[dateObj.getDay()],
          status: effectiveStatus,
          note,
          wage,
          isAutoSunday,
          isSaved: Boolean(saved),
        });
      });

      const totalTercatat = totalMasuk + totalLibur;
      const estimasiGaji = totalMasuk * Number(appState.settings.dailyWage);

      return {
        dates,
        startDateStr: dates[0],
        endDateStr: dates[dates.length - 1],
        totalTercatat,
        totalMasuk,
        totalLibur,
        totalBelumInfo,
        estimasiGaji,
        dailyRows,
      };
    }

    // =========================================================================
    // NAVIGATION & HEADER UPDATES
    // =========================================================================
    function updateHeader() {
      const name = appState.settings.workerName || 'Pekerja Harian';
      const wage = formatRupiah(appState.settings.dailyWage);
      document.getElementById('header-user-info').textContent = `${name} • ${wage}/hari`;
      document.getElementById('header-month-label').textContent = `${MONTHS_SHORT_ID[activeMonth]} ${activeYear}`;

      // Reminder check
      const todayStr = toDateStr(new Date());
      const todayRec = appState.records[todayStr];
      const banner = document.getElementById('reminder-banner');
      if (
        appState.settings.reminderEnabled &&
        !reminderDismissedToday &&
        (!todayRec || todayRec.status === 'Belum Ada Info')
      ) {
        banner.classList.remove('hidden');
        document.getElementById('reminder-banner-text').textContent =
          `Absensi hari ini belum dicatat (Pengingat ${appState.settings.reminderTime})`;
      } else {
        banner.classList.add('hidden');
      }
    }

    function dismissReminderBanner() {
      reminderDismissedToday = true;
      document.getElementById('reminder-banner').classList.add('hidden');
    }

    function changeActiveMonth(delta) {
      activeMonth += delta;
      if (activeMonth < 0) {
        activeMonth = 11;
        activeYear--;
      } else if (activeMonth > 11) {
        activeMonth = 0;
        activeYear++;
      }
      renderCurrentTab();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isTarget = btn.getAttribute('data-tab') === tabName;
        if (isTarget) {
          btn.classList.add('text-emerald-600', 'bg-emerald-50');
          btn.classList.remove('text-slate-500');
          btn.querySelector('span').classList.replace('font-medium', 'font-semibold');
        } else {
          btn.classList.remove('text-emerald-600', 'bg-emerald-50');
          btn.classList.add('text-slate-500');
          btn.querySelector('span').classList.replace('font-semibold', 'font-medium');
        }
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      updateHeader();
      const container = document.getElementById('main-content');
      if (currentTab === 'dashboard') container.innerHTML = renderDashboardView();
      else if (currentTab === 'calendar') container.innerHTML = renderCalendarView();
      else if (currentTab === 'history') container.innerHTML = renderHistoryView();
      else if (currentTab === 'report') container.innerHTML = renderReportView();
      else if (currentTab === 'settings') container.innerHTML = renderSettingsView();
    }

        return `

      }

      return `<div class="space-y-2">` + recorded.map((item) => `
        <div onclick="openAttendanceModal('${item.dateStr}')" class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 hover:bg-slate-100 cursor-pointer transition">
          <div class="flex items-center gap-3">

    }

    // =========================================================================
    // VIEW 2: KALENDER ABSENSI BULANAN
    // =========================================================================
    function renderCalendarView() {
      const firstDayOfMonth = new Date(activeYear, activeMonth, 1).getDay(); // 0 (Min) - 6 (Sab)
      const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
      const todayStr = toDateStr(new Date());
      const summary = calculatePeriodSummary(activeYear, activeMonth);

      let cellsHtml = '';
      // Empty padding cells before day 1
      for (let i = 0; i < firstDayOfMonth; i++) {
        cellsHtml += `<div class="h-14 rounded-2xl bg-slate-100/50"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(activeYear, activeMonth, day);
        const dateStr = toDateStr(dateObj);
        const isSunday = dateObj.getDay() === 0;
        const isToday = dateStr === todayStr;
        const saved = appState.records[dateStr];

        let status = 'Belum Ada Info';
        if (saved) {
          status = saved.status;
        } else if (appState.settings.autoSundayOff && isSunday) {
          status = 'Libur';
        }

        let cellBg = 'bg-white border-slate-200/80 text-slate-800';
        let dotHtml = `<span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>`;
        let badgeText = '';

        if (status === 'Masuk') {
          cellBg = 'bg-emerald-50 border-emerald-300 text-emerald-950';
          dotHtml = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span>`;
          badgeText = 'Masuk';
        } else if (status === 'Libur') {
          cellBg = 'bg-amber-50 border-amber-300 text-amber-950';
          dotHtml = `<span class="w-2 h-2 rounded-full bg-amber-500"></span>`;
          badgeText = 'Libur';
        }

        const todayRing = isToday ? 'ring-2 ring-slate-900 ring-offset-1' : '';

        cellsHtml += `
          <button onclick="openAttendanceModal('${dateStr}')"
            class="h-14 rounded-2xl border ${cellBg} ${todayRing} flex flex-col items-center justify-between p-1.5 active:scale-95 transition relative">
            <span class="text-xs font-bold ${isSunday && status !== 'Masuk' ? 'text-rose-600' : ''}">${day}</span>
            ${dotHtml}
            <span class="text-[9px] font-semibold leading-none truncate max-w-full ${
              status === 'Masuk' ? 'text-emerald-700' : status === 'Libur' ? 'text-amber-700' : 'text-slate-400'
            }">${badgeText || '-'}</span>
          </button>
        `;
      }

      return `
        <div class="space-y-4 fade-in">
          <div class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">

            <div class="grid grid-cols-7 gap-1.5 text-center mb-1.5">

              <span class="text-[11px] font-bold text-slate-500">Sen</span>
              <span class="text-[11px] font-bold text-slate-500">Sel</span>

              <span class="text-[11px] font-bold text-slate-500">Jum</span>

            <!-- Calendar Grid -->
            <div class="grid grid-cols-7 gap-1.5">
              ${cellsHtml}

          </div>

          <!-- Info Rule Box -->
          <div class="bg-blue-50/80 border border-blue-200/80 rounded-2xl p-3.5 flex items-start gap-2.5 text-xs text-blue-900">
            <svg class="w-4 h-4 text-blue-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

      `;
    }

      const d = new Date();
      activeYear = d.getFullYear();

                  <p class="text-xs font-bold mt-1 ${item.status === 'Masuk' ? 'text-emerald-600' : 'text-slate-400'}">

    function exportToExcel() {
      try {
        const summary = calculatePeriodSummary(activeYear, activeMonth);
        const monthTitle = `${MONTHS_ID[activeMonth]}_${activeYear}`;

        const rows = [
          ['LAPORAN ABSENSI & GAJI DAILY WORKER'],
          ['Nama Pekerja', appState.settings.workerName],
          ['Posisi / Bagian', appState.settings.workerRole],
          ['Periode', `${summary.startDateStr} s/d ${summary.endDateStr}`],
          ['Upah Harian', Number(appState.settings.dailyWage)],
          [],
          ['Tanggal', 'Hari', 'Status', 'Catatan', 'Upah (IDR)'],
        ];

        summary.dailyRows.forEach((r) => {
          rows.push([r.dateStr, r.dayName, r.status, r.note || '-', r.wage]);
        });

        rows.push([]);
        rows.push(['RINGKASAN BULANAN']);
        rows.push(['Total Hari Tercatat', summary.totalTercatat]);
        rows.push(['Total Hari Masuk', summary.totalMasuk]);
        rows.push(['Total Hari Libur', summary.totalLibur]);
        rows.push(['Total Gaji Diterima (IDR)', summary.estimasiGaji]);

        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.utils.book_new();
          const ws = XLSX.utils.aoa_to_sheet(rows);
          ws['!cols'] = [{ wch: 14 }, { wch: 12 }, { wch: 16 }, { wch: 28 }, { wch: 16 }];
          XLSX.utils.book_append_sheet(wb, ws, 'Laporan Gaji');
          XLSX.writeFile(wb, `Daily_Worker_Report_${monthTitle}.xlsx`);
          showToast('File Excel (.xlsx) berhasil diunduh!');
        } else {
          // Fallback CSV
          const csvContent = rows.map((e) => e.join(',')).join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `Daily_Worker_Report_${monthTitle}.csv`;
          link.click();
          showToast('File CSV berhasil diunduh!');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal mengekspor Excel', 'error');
      }
    }

    function exportToPDF() {
      try {
        if (!window.jspdf) {
          showToast('Library PDF belum siap, coba lagi', 'error');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const summary = calculatePeriodSummary(activeYear, activeMonth);
        const monthTitle = `${MONTHS_ID[activeMonth]} ${activeYear}`;

        // Header
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 210, 34, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.setFont('helvetica', 'bold');
        doc.text('DAILY WORKER TRACKER', 14, 15);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.text(`Laporan Absensi & Rekap Gaji Bulanan - ${monthTitle}`, 14, 23);

        // Worker Info
        doc.setTextColor(30, 41, 59);
        doc.setFontSize(10);
        doc.text(`Nama Pekerja : ${appState.settings.workerName}`, 14, 44);
        doc.text(`Posisi / Divisi : ${appState.settings.workerRole}`, 14, 50);
        doc.text(`Periode Gaji    : ${summary.startDateStr} s/d ${summary.endDateStr}`, 14, 56);
        doc.text(`Upah Harian     : ${formatRupiah(appState.settings.dailyWage)}`, 14, 62);

        // Summary Box
        doc.setFillColor(241, 245, 249);
        doc.roundedRect(14, 68, 182, 22, 3, 3, 'F');
        doc.setFont('helvetica', 'bold');
        doc.text(`Hari Tercatat: ${summary.totalTercatat}`, 20, 77);
        doc.text(`Masuk: ${summary.totalMasuk} Hari`, 72, 77);
        doc.text(`Libur: ${summary.totalLibur} Hari`, 122, 77);
        doc.setTextColor(5, 150, 105);
        doc.setFontSize(11);
        doc.text(`Total Gaji Diterima: ${formatRupiah(summary.estimasiGaji)}`, 20, 85);

        // Table
        const tableRows = summary.dailyRows
          .filter((r) => r.status !== 'Belum Ada Info')
          .map((r) => [r.dateStr, r.dayName, r.status, r.note || '-', formatRupiah(r.wage)]);

        doc.autoTable({
          startY: 96,
          head: [['Tanggal', 'Hari', 'Status', 'Catatan', 'Upah']],
          body: tableRows.length > 0 ? tableRows : [['-', '-', 'Belum ada data tercatat', '-', 'Rp0']],
          theme: 'grid',
          headStyles: { fillColor: [15, 23, 42], textColor: 255, fontSize: 9 },
          bodyStyles: { fontSize: 8.5, textColor: 51 },
          columnStyles: { 4: { halign: 'right', fontStyle: 'bold' } },
        });

        doc.save(`Laporan_Gaji_${MONTHS_ID[activeMonth]}_${activeYear}.pdf`);
        showToast('Laporan PDF berhasil diunduh!');
      } catch (err) {
        console.error(err);
        showToast('Gagal mengekspor PDF', 'error');
      }
    }

    function toggleCutoffInput(val) {
      const el = document.getElementById('cutoff-day-wrapper');

      else el.classList.add('hidden');

    function saveSettingsForm() {
      const name = document.getElementById('set-worker-name').value.trim() || 'Pekerja Harian';
      const role = document.getElementById('set-worker-role').value.trim() || 'Daily Worker';
      const wage = Math.max(0, Number(document.getElementById('set-daily-wage').value) || 0);
      const autoSunday = document.getElementById('set-auto-sunday').checked;
      const periodType = document.getElementById('set-period-type').value;
      const cutoffDay = Math.min(28, Math.max(1, Number(document.getElementById('set-cutoff-day').value) || 26));
      const reminderEnabled = document.getElementById('set-reminder-enabled').checked;
      const reminderTime = document.getElementById('set-reminder-time').value || '17:00';

      appState.settings = {
        workerName: name,
        workerRole: role,
        dailyWage: wage,
        autoSundayOff: autoSunday,
        payPeriodType: periodType,
        cutoffStartDay: cutoffDay,
        reminderEnabled,
        reminderTime,
      };

      saveStateToStorage();
      renderCurrentTab();
      showToast('Pengaturan berhasil disimpan!');
    }

    function backupDataJSON() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_DailyWorker_${toDateStr(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File backup JSON berhasil diunduh!');
    }

    function restoreDataJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported || typeof imported !== 'object' || !imported.records) {
            throw new Error('Format file tidak valid');
          }
          appState = {
            settings: { ...DEFAULT_STATE.settings, ...(imported.settings || {}) },
            records: imported.records || {},
          };
          saveStateToStorage();
          renderCurrentTab();
          showToast('Data berhasil dipulihkan!');
        } catch (err) {
          showToast('File backup tidak valid atau rusak', 'error');
        }
      };
      reader.readAsText(file);
    }

    function confirmResetCurrentMonth() {
      showConfirmModal(
        `Reset ${MONTHS_ID[activeMonth]} ${activeYear}?`,
        `Semua catatan absensi pada periode ${MONTHS_ID[activeMonth]} ${activeYear} akan dikosongkan. Riwayat bulan lain tidak akan terhapus.`,
        () => {
          const periodDates = getPeriodDates(activeYear, activeMonth);
          periodDates.forEach((dateStr) => {
            delete appState.records[dateStr];
          });
          saveStateToStorage();
          renderCurrentTab();
          showToast(`Data ${MONTHS_ID[activeMonth]} ${activeYear} telah direset`);
        }
      );
    }

    function quickSetAttendance(dateStr, status) {
      const existingNote = appState.records[dateStr]?.note || '';
      if (status === 'Belum Ada Info' && !existingNote) {
        delete appState.records[dateStr];
      } else {
        appState.records[dateStr] = {
          status,
          note: existingNote,
          updatedAt: new Date().toISOString(),

      saveStateToStorage();
      renderCurrentTab();
      showToast(`Status ${formatDateIndo(dateStr, false)}: ${status}`);
    }

    }

    function saveAttendanceFromModal() {
      const dateStr = document.getElementById('modal-date-value').value;
      const note = document.getElementById('modal-note-input').value.trim();

      appState.records[dateStr] = {
        status: selectedModalStatus,
        note,
        updatedAt: new Date().toISOString(),
      };

      saveStateToStorage();
      closeAttendanceModal();
      renderCurrentTab();
      showToast(`Absensi ${formatDateIndo(dateStr, false)} disimpan!`);
    }

    // =========================================================================
    // UI UTILITIES (BADGES, TOAST, CONFIRM MODAL)
    // =========================================================================
    function getStatusBadgeClass(status) {
      if (status === 'Masuk') return 'bg-emerald-100 text-emerald-700';
      if (status === 'Libur') return 'bg-amber-100 text-amber-700';
      return 'bg-slate-100 text-slate-600';
    }

    let toastTimeout = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');

      text.textContent = message;
      icon.className = `w-2 h-2 rounded-full ${type === 'error' ? 'bg-rose-400' : 'bg-emerald-400'}`;

      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2400);
    }

    let confirmCallback = null;
    function showConfirmModal(title, message, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      confirmCallback = null;
    }

    document.getElementById('confirm-yes-btn').addEventListener('click', () => {
      if (typeof confirmCallback === 'function') confirmCallback();
      closeConfirmModal();
    });

    // Close bottom sheet when clicking backdrop
    document.getElementById('attendance-modal').addEventListener('click', (e) => {
      if (e.target.id === 'attendance-modal') closeAttendanceModal();
    });

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentTab();
    });
  </script>
</body>
</html>
